name: Deploy

# Build the site from the committed data and publish it to surge.sh.
# Needs the repository secret SURGE_TOKEN. Get one with `npx surge token`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOMAIN: handheld-atlas.surge.sh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # validate.py needs jsonschema. build_site.py needs only the standard library.
      - name: Validate data
        run: |
          pip install "jsonschema>=4.23"
          python scripts/validate.py

      # The site uses real paths (/browse, /compare?d=..., /<device-id>).
      # --pages writes one small page per screen and device, so link previews
      # get their own title, description and image. surge.sh serves
      # <name>.html at /<name> and answers any other path with 200.html.
      # artifact.html, the fragment for claude.ai, is not published.
      - name: Build site
        run: python scripts/build_site.py --pages "$RUNNER_TEMP/pub" --site-url "https://$DOMAIN"

      - name: Publish to surge.sh
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "::error::Set the SURGE_TOKEN repository secret."
            exit 1
          fi
          npx --yes surge@0.52.0 "$RUNNER_TEMP/pub" "$DOMAIN"

      # A deep link must get its page, not a 404, and a device page must carry
      # its own preview tags.
      - name: Check deep links
        shell: bash
        run: |
          get() { curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "https://$DOMAIN$1"; }
          for path in / /browse "/compare?d=steam-deck-oled" /steam-deck-oled /no-such-page /atlas.css /atlas.js /atlas-data.js; do
            get "$path" > /dev/null
            echo "OK $path"
          done
          # Read the page first: under pipefail, grep -q can stop curl with SIGPIPE.
          page=$(get /steam-deck-oled)
          grep -q '<meta property="og:title" content="Valve Steam Deck OLED">' <<< "$page"
          echo "OK /steam-deck-oled preview tags"
          type=$(curl -fsS -o /dev/null -w '%{content_type}' "https://$DOMAIN/og.png")
          [ "$type" = "image/png" ]
          echo "OK /og.png ($type)"
