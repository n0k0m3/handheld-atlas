name: Deploy

# Build the site from the committed data and publish it to surge.sh.
# Needs the repository secret SURGE_TOKEN. Get one with `npx surge token`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOMAIN: handheld-atlas.surge.sh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # validate.py needs jsonschema. build_site.py needs only the standard library.
      - name: Validate data
        run: |
          pip install "jsonschema>=4.23"
          python scripts/validate.py

      - name: Build site
        run: python scripts/build_site.py

      # artifact.html is a fragment for claude.ai, not a page, so it stays out.
      # The site uses real paths (/browse, /compare?d=..., /<device-id>).
      # surge.sh answers a path with no file with 200.html, so publish a
      # folder that holds index.html and the same page as 200.html.
      - name: Publish to surge.sh
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "::error::Set the SURGE_TOKEN repository secret."
            exit 1
          fi
          pub="$RUNNER_TEMP/pub"
          mkdir -p "$pub"
          cp site/dist/index.html "$pub/index.html"
          cp site/dist/index.html "$pub/200.html"
          npx --yes surge@0.52.0 "$pub" "$DOMAIN"

      # A deep link must get the page, not a 404.
      - name: Check deep links
        run: |
          for path in / /browse "/compare?d=steam-deck-oled" /steam-deck-oled; do
            curl -fsS -o /dev/null --retry 5 --retry-delay 5 --retry-all-errors "https://$DOMAIN$path"
            echo "OK $path"
          done
